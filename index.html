<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Brâmica · Oficina de cerâmica no Porto (pré-visualização)</title>
  <meta name="description" content="Pré-visualização de design: oficina de cerâmica Brâmica, Porto. Workshops e residências. Não é um site oficial.">
  <meta name="theme-color" content="#f4eee3">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230e442a'/%3E%3Ctext x='32' y='41' font-family='Montserrat,Arial' font-size='28' font-weight='300' fill='%23f4eee3' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preload" as="image" href="assets/img/studio-shelf-l.webp" type="image/webp">

<body data-page="home" data-title="meta.titleHome">
  <header id="site-header"></header>

  <main id="main" tabindex="-1">

    <!-- HERO -->
    <section class="hero" aria-labelledby="hero-title">
      <div class="container hero-grid">
        <div>
          <p class="eyebrow" data-i18n="hero.eyebrow"></p>
          <h1 id="hero-title" data-i18n-html="hero.title"></h1>
          <p class="lead" data-i18n="hero.sub"></p>
          <div class="hero-actions">
            <a class="btn" href="booking.html" data-i18n="cta.book"></a>
            <a class="btn btn-ghost" href="#portfolio" data-i18n="cta.portfolio"></a>
          </div>
          <div class="hero-meta">
            <div><b data-i18n="hero.m1v"></b><span data-i18n="hero.m1l"></span></div>
            <div><b data-i18n="hero.m2v"></b><span data-i18n="hero.m2l"></span></div>
            <div><b data-i18n="hero.m3v"></b><span data-i18n="hero.m3l"></span></div>
          </div>
        </div>
        <div class="collage">
          <figure class="c1"><img src="assets/img/studio-shelf-l.webp" width="842" height="1124" fetchpriority="high" decoding="async" data-alt="studio-shelf" alt=""></figure>
          <figure class="c2"><img src="assets/img/green-vase-l.webp" width="778" height="974" loading="lazy" decoding="async" data-alt="green-vase" alt=""></figure>
          <figure class="c3"><img src="assets/img/two-cups-l.webp" width="444" height="568" loading="lazy" decoding="async" data-alt="two-cups" alt=""></figure>
          <div class="badge" aria-hidden="true">
            <svg viewBox="0 0 120 120"><defs><path id="badge-path" d="M60,60 m-45,0 a45,45 0 1,1 90,0 a45,45 0 1,1 -90,0"/></defs>
              <text><textPath href="#badge-path" id="badge-text" textLength="280" lengthAdjust="spacing"></textPath></text></svg>
            <span class="dot"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- HOW IT WORKS -->
    <section class="how" aria-labelledby="how-title">
      <div class="container">
        <h2 id="how-title" data-i18n="how.title"></h2>
        <ol>
          <li data-reveal><b data-i18n="how.s1t"></b><span data-i18n="how.s1d"></span></li>
          <li data-reveal="80"><b data-i18n="how.s2t"></b><span data-i18n="how.s2d"></span></li>
          <li data-reveal="160"><b data-i18n="how.s3t"></b><span data-i18n="how.s3d"></span></li>
          <li data-reveal="240"><b data-i18n="how.s4t"></b><span data-i18n="how.s4d"></span></li>
        </ol>
      </div>
    </section>

    <!-- PORTFOLIO -->
    <section class="section" id="portfolio" aria-labelledby="portfolio-title">
      <div class="container">
        <div class="section-head" data-reveal>
          <p class="eyebrow" data-i18n="portfolio.eyebrow"></p>
          <h2 id="portfolio-title" data-i18n="portfolio.title"></h2>
          <p class="lead" data-i18n="portfolio.intro"></p>
        </div>
        <div class="gallery" id="gallery"></div>
        <div class="gallery-actions">
          <button class="btn btn-ghost" type="button" id="gallery-more" aria-expanded="false" aria-controls="gallery" data-i18n="portfolio.more"></button>
        </div>
      </div>
    </section>

    <!-- WORKSHOPS -->
    <section class="section" id="workshops" aria-labelledby="workshops-title" style="padding-top:0">
      <div class="container">
        <div class="ws-strip" data-reveal>
          <figure><img src="assets/img/three-cups-l.webp" width="492" height="450" loading="lazy" decoding="async" data-alt="three-cups" alt=""></figure>
          <figure><img src="assets/img/plate-bowls-l.webp" width="534" height="444" loading="lazy" decoding="async" data-alt="plate-bowls" alt=""></figure>
          <figure><img src="assets/img/white-cups-l.webp" width="440" height="382" loading="lazy" decoding="async" data-alt="white-cups" alt=""></figure>
        </div>
        <div class="section-head" data-reveal>
          <p class="eyebrow" data-i18n="workshops.eyebrow"></p>
          <h2 id="workshops-title" data-i18n="workshops.title"></h2>
          <p class="lead" data-i18n="workshops.intro"></p>
        </div>
        <div class="ws-grid">
          <dl class="facts" data-reveal>
            <div><dt data-i18n="workshops.whenT"></dt><dd data-i18n="workshops.whenD"></dd></div>
            <div><dt data-i18n="workshops.timeT"></dt><dd data-i18n="workshops.timeD"></dd></div>
            <div><dt data-i18n="workshops.sessionsT"></dt><dd data-i18n="workshops.sessionsD"></dd></div>
            <div><dt data-i18n="workshops.piecesT"></dt><dd data-i18n="workshops.piecesD"></dd></div>
            <div><dt data-i18n="workshops.includedT"></dt><dd data-i18n="workshops.includedD"></dd></div>
            <div><dt data-i18n="workshops.excludedT"></dt><dd data-i18n="workshops.excludedD"></dd></div>
          </dl>
          <div class="price-card" data-reveal="120">
            <p class="big" data-i18n="workshops.price"></p>
            <p class="vat" data-i18n="workshops.priceVat"></p>
            <p data-i18n-html="workshops.deposit"></p>
            <p data-i18n-html="workshops.remaining"></p>
            <div class="next-dates">
              <h3 data-i18n="workshops.nextDates"></h3>
              <ul id="next-dates-list" style="list-style:none;margin:0;padding:0"></ul>
            </div>
            <a class="btn btn-amber btn-block" href="booking.html" data-i18n="cta.book"></a>
          </div>
        </div>
      </div>
    </section>

    <!-- RESIDÊNCIAS -->
    <section class="section dark" id="residencias" aria-labelledby="resid-title">
      <div class="container">
        <div class="section-head" data-reveal>
          <p class="eyebrow" data-i18n="resid.eyebrow"></p>
          <h2 id="resid-title" data-i18n="resid.title"></h2>
          <p class="lead" data-i18n="resid.intro"></p>
          <span class="vacancy" data-i18n="resid.vacancies"></span>
        </div>
        <div class="resid-grid">
          <article class="pkg" data-reveal>
            <span class="opt" data-i18n="resid.optionA"></span>
            <p class="hrs">12h</p>
            <p class="price">€60<small>**</small></p>
            <p class="valid" data-i18n="resid.validity1"></p>
            <a class="btn btn-amber" href="payment.html?order=package&amp;pkg=A" data-i18n="cta.buyPackage"></a>
          </article>
          <article class="pkg" data-reveal="100">
            <span class="opt" data-i18n="resid.optionB"></span>
            <p class="hrs">30h</p>
            <p class="price">€135<small>**</small></p>
            <p class="valid" data-i18n="resid.validity3"></p>
            <a class="btn btn-amber" href="payment.html?order=package&amp;pkg=B" data-i18n="cta.buyPackage"></a>
          </article>
          <article class="pkg" data-reveal="200">
            <span class="opt" data-i18n="resid.optionC"></span>
            <p class="hrs">60h</p>
            <p class="price">€220<small>**</small></p>
            <p class="valid" data-i18n="resid.validity6"></p>
            <a class="btn btn-amber" href="payment.html?order=package&amp;pkg=C" data-i18n="cta.buyPackage"></a>
          </article>
        </div>
        <p class="resid-notes"><span data-i18n="resid.note1"></span><br><span data-i18n="resid.note2"></span></p>
      </div>
    </section>

    <!-- STUDIO -->
    <section class="section studio" id="studio" aria-labelledby="studio-title">
      <div class="container studio-grid">
        <div data-reveal>
          <p class="eyebrow" data-i18n="studio.eyebrow"></p>
          <h2 id="studio-title" data-i18n="studio.title" style="margin-bottom:2.2rem"></h2>
          <div class="info-block">
            <h3 data-i18n="studio.addressT"></h3>
            <address data-i18n-html="studio.address"></address>
            <a class="map-link" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Rua+de+Santo+Isidro+181+4000-474+Porto"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-11.2A7 7 0 0 0 5 9.8C5 14.8 12 21 12 21z"/><circle cx="12" cy="10" r="2.5"/></svg><span data-i18n="studio.map"></span></a>
          </div>
          <div class="info-block">
            <h3 data-i18n="studio.hoursT"></h3>
            <p data-i18n-html="studio.hours"></p>
          </div>
          <div class="info-block">
            <h3 data-i18n="studio.contactsT"></h3>
            <ul class="contact-list">
              <li><a href="https://wa.me/351961097013" target="_blank" rel="noopener"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>+351 961 097 013</a></li>
              <li><a href="https://www.instagram.com/oficinabramica" target="_blank" rel="noopener"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17" cy="7" r=".6"/></svg>@oficinabramica</a></li>
              <li><a href="mailto:oficinabramica@gmail.com"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M3.5 6.5l8.5 7 8.5-7"/></svg>oficinabramica@gmail.com</a></li>
            </ul>
          </div>
        </div>
        <div class="studio-photos" data-reveal="140">
          <figure class="p1"><img src="assets/img/plant-cabinet-l.webp" width="642" height="1018" loading="lazy" decoding="async" data-alt="plant-cabinet" alt=""></figure>
          <figure class="p2"><img src="assets/img/twelve-cups-l.webp" width="476" height="410" loading="lazy" decoding="async" data-alt="twelve-cups" alt=""></figure>
        </div>
      </div>
    </section>

    <!-- CONTACT -->
    <section class="section" id="contact" aria-labelledby="contact-title">
      <div class="container contact-grid">
        <div data-reveal>
          <p class="eyebrow" data-i18n="contact.eyebrow"></p>
          <h2 id="contact-title" data-i18n="contact.title" style="margin-bottom:1.2rem"></h2>
          <p class="lead" data-i18n="contact.intro" style="margin-bottom:2rem"></p>
          <form class="form" id="contact-form" novalidate>
            <div class="field"><label for="c-name" data-i18n="contact.name"></label><input id="c-name" name="name" autocomplete="name" aria-describedby="c-name-err"><p class="err" id="c-name-err" role="alert"></p></div>
            <div class="field"><label for="c-email" data-i18n="contact.email"></label><input id="c-email" name="email" type="email" autocomplete="email" aria-describedby="c-email-err"><p class="err" id="c-email-err" role="alert"></p></div>
            <div class="field"><label for="c-msg" data-i18n="contact.message"></label><textarea id="c-msg" name="message" aria-describedby="c-msg-err"></textarea><p class="err" id="c-msg-err" role="alert"></p></div>
            <div><button class="btn" type="submit" data-i18n="contact.send"></button></div>
            <p class="form-ok" id="contact-ok" role="status" hidden data-i18n="contact.okDemo"></p>
          </form>
        </div>
        <div class="quick-links" data-reveal="140">
          <a class="btn btn-ghost" href="https://wa.me/351961097013" target="_blank" rel="noopener"><span class="ql-lab" data-i18n="contact.whatsapp"></span><span class="ql-val">+351 961 097 013</span></a>
          <a class="btn btn-ghost" href="https://www.instagram.com/oficinabramica" target="_blank" rel="noopener"><span class="ql-lab" data-i18n="contact.instagram"></span><span class="ql-val">@oficinabramica</span></a>
          <a class="btn btn-ghost" href="mailto:oficinabramica@gmail.com"><span class="ql-lab" data-i18n="contact.emailLink"></span><span class="ql-val">oficinabramica@gmail.com</span></a>
        </div>
      </div>
    </section>

    <!-- ROADMAP -->
    <section class="section roadmap" id="roadmap" aria-labelledby="road-title">
      <div class="container">
        <div class="section-head" data-reveal>
          <p class="eyebrow" data-i18n="road.eyebrow"></p>
          <h2 id="road-title" data-i18n="road.title"></h2>
          <p class="lead" data-i18n="road.intro"></p>
        </div>
        <div class="road-grid">
          <article class="road-card" data-reveal><span class="chip" data-i18n="road.planned"></span><h3 data-i18n="road.c1t"></h3><p data-i18n="road.c1d"></p></article>
          <article class="road-card" data-reveal="80"><span class="chip" data-i18n="road.planned"></span><h3 data-i18n="road.c2t"></h3><p data-i18n="road.c2d"></p></article>
          <article class="road-card" data-reveal="160"><span class="chip" data-i18n="road.planned"></span><h3 data-i18n="road.c3t"></h3><p data-i18n="road.c3d"></p></article>

        </div>
        <div class="road-actions">
          <a class="btn" href="admin-preview.html" data-i18n="road.previewAdmin"></a>
          <small data-i18n="road.previewChat"></small>
        </div>
      </div>
    </section>
  </main>
